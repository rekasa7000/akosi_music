name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege default: this job only reads the repo and runs
# lint/typecheck/build/test, it never needs to write anything back
# (no PR comments, no releases, no package publishing) — so the
# GITHUB_TOKEN every step implicitly gets should be read-only.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # A real Postgres, not a mock — apps/api's integration tests
    # (admin-auth, card redemption) exercise Prisma against it
    # directly, including the row-level race-condition defenses that
    # are the whole point of several of those tests.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: akosi
          POSTGRES_PASSWORD: akosi
          POSTGRES_DB: akosi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U akosi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://akosi:akosi@localhost:5432/akosi
      NODE_ENV: test
      # Dev-only placeholder values, not real secrets — same ones
      # committed in apps/api/.env for local docker-compose dev.
      JWT_SECRET: ci-test-secret-not-for-production
      TOTP_ENCRYPTION_KEY: 4RG3dB7AukApFVV8zTYudg7CM/sNQJkeg7kQX6VtNWE=
    steps:
      # Actions pinned to commit SHAs (not mutable version tags) per
      # supply-chain hardening guidance — each comment names the tag
      # the SHA currently resolves to; Dependabot's github-actions
      # ecosystem bumps these automatically.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # This job builds and runs untrusted PR code (lint/test
          # scripts, package install scripts) — no step after this one
          # needs an authenticated git remote, so don't leave the
          # checkout token sitting on disk for them to find.
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Prisma client generation isn't part of any package's `build`
      # script — apps/api's Dockerfile runs this as its own step for
      # the same reason, and apps/web/packages/database's typecheck
      # and build both fail without it.
      - run: pnpm --filter @akosi/database generate

      - run: pnpm --filter @akosi/database migrate:deploy

      - run: pnpm turbo run lint typecheck build test
