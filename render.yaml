services:
  - type: web
    name: akosi-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    region: singapore
    plan: 0.5c-512mb
    healthCheckPath: /health
    # Runs against the newly built image before it takes traffic —
    # keeps schema changes that ship with a quarterly card drop from
    # requiring a separate manual migration step.
    preDeployCommand: pnpm --filter @akosi/database migrate:deploy
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      # Everything below is set in the Render dashboard, not here —
      # never committed, per the key-storage rule in
      # docs/04-tech-stack.md. See docs/13-deployment.md's env var
      # mapping table for what each one becomes in production.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: TOTP_ENCRYPTION_KEY
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_BUCKET_RAW
        sync: false
      - key: S3_BUCKET_MEDIA
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: WEB_ORIGIN
        sync: false
      # Must not be "true" anywhere this deploy can read it — see the
      # same line in docs/13-deployment.md's env var table.
      - key: ENABLE_DEV_UPLOAD_ROUTES
        value: "false"
