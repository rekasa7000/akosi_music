services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: akosi
      POSTGRES_PASSWORD: akosi
      POSTGRES_DB: akosi
    ports:
      - "5432:5432"
    volumes:
      - akosi-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U akosi"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Emulates real AWS S3 locally (not a different product like MinIO) —
  # the storage adapter talks the actual AWS S3 API either way, so
  # pointing it at real AWS later is just an env var change.
  localstack:
    image: localstack/localstack:3.8
    restart: unless-stopped
    environment:
      SERVICES: s3
      DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: akosi
      AWS_SECRET_ACCESS_KEY: akosi-dev-secret
    ports:
      - "4566:4566" # edge port — all emulated AWS APIs
    volumes:
      - akosi-localstack-data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  localstack-init:
    image: amazon/aws-cli:latest
    depends_on:
      localstack:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: akosi
      AWS_SECRET_ACCESS_KEY: akosi-dev-secret
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: >
      sh -c "
      aws --endpoint-url=http://localstack:4566 s3 mb s3://akosi-raw &&
      aws --endpoint-url=http://localstack:4566 s3 mb s3://akosi-media &&
      echo '{\"CORSRules\":[{\"AllowedMethods\":[\"PUT\",\"GET\",\"HEAD\"],\"AllowedOrigins\":[\"http://localhost:3000\",\"http://localhost:3001\"],\"AllowedHeaders\":[\"*\"],\"ExposeHeaders\":[\"ETag\"]}]}' > /tmp/cors.json &&
      aws --endpoint-url=http://localstack:4566 s3api put-bucket-cors --bucket akosi-raw --cors-configuration file:///tmp/cors.json &&
      aws --endpoint-url=http://localstack:4566 s3api put-bucket-cors --bucket akosi-media --cors-configuration file:///tmp/cors.json
      "

  # Local SMTP catcher — verification/login-MFA emails land here instead
  # of a real inbox during dev. Web UI at :8025, SMTP at :1025.
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI + API (used to assert on sent emails in tests)
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8025/api/v1/info"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      NODE_ENV: development
      ENABLE_DEV_UPLOAD_ROUTES: "true"
      DATABASE_URL: "postgresql://akosi:akosi@postgres:5432/akosi"
      S3_ENDPOINT: "http://localstack:4566"
      S3_REGION: "us-east-1"
      S3_ACCESS_KEY_ID: "akosi"
      S3_SECRET_ACCESS_KEY: "akosi-dev-secret"
      S3_BUCKET_RAW: "akosi-raw"
      S3_BUCKET_MEDIA: "akosi-media"
      JWT_SECRET: "dev-only-insecure-secret-change-me"
      TOTP_ENCRYPTION_KEY: "4RG3dB7AukApFVV8zTYudg7CM/sNQJkeg7kQX6VtNWE="
      SMTP_HOST: "mailpit"
      SMTP_PORT: 1025
      SMTP_FROM: "Akosi Admin <admin@akosi.local>"
    # Image's runtime stage keeps prisma as a dependency specifically
    # so migrate deploy can run before the app takes traffic (same
    # reasoning as render.yaml's preDeployCommand).
    command: sh -c "cd /app && pnpm --filter @akosi/database migrate:deploy && cd /app/apps/api && node dist/index.js"
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
      mailpit:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "http://localhost:4000"
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  akosi-postgres-data:
  akosi-localstack-data:
